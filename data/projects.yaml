# Projects - one entry per road project the site covers.
#
#   id     short name; must match the facts file (data/facts/<id>.yaml) and
#          the first part of every fact id in it ("rangeland.aadt...")
#   name   how the project is titled on the site
#   short  the short name used in the project bar, filters and timeline
#   plan   optional - its number(s) in the MPO's long range plan
#   stage  where it is in the process, in a few words (home page card)
#   about  one plain sentence on what is proposed (home page card)
#   page   true when the project has its own page at /<id>/
#   card   the words on its link-preview card (src/og-<id>.png), needed once it
#          has a page: title, and optionally eyebrow (top line; default
#          "Pasco County · <short>"), sub (a line under the title), note (bottom
#          left; default its address) and right (bottom right). Keep dates off
#          it unless someone will change them when they pass. After changing a
#          card, Claude redraws it (node tools/og-card.mjs); the build stops
#          until then.
#
# Rule (Patrick, 29 Sep 2026): a NEW project is published (page: true) only once
# every project already published - those above it in this file - has at least
# 90% of its figures verified by Patrick. New projects go at the END of this file.
# The build stops otherwise. The number lives in eleventy.config.js
# (PUBLISH_THRESHOLD) and is shown on the home page.
#   published_before_rule  true only for a project that was already live when
#                          the rule was made (Sunlake went up before Rangeland
#                          reached 90%)
#
# The build stops if a facts file has no project here.

- id: rangeland
  short: Rangeland Blvd corridor
  name: Rangeland Blvd extension - Cattle Gap Trl to Bexley Village Dr
  plan: LRTP 114.2
  stage: Route study - Workshop 3 held, comments closed 8 Oct
  about: A mostly new four-lane road from Cattle Gap Trail to Bexley Village Drive, with a bridge over the Suncoast Parkway. Three alternatives remain.
  page: true
  card:
    eyebrow: "Pasco County · Rangeland Blvd Route Study"
    title: "A Guide to the Rangeland Blvd Study"
    sub: "What's proposed, how it fits into the county's larger plan, and what still hasn't been answered."
    note: "Comments close Thursday, 8 October"
    right: "Study complete · Fall 2026"

- id: sunlake
  short: Sunlake Blvd corridor
  name: Sunlake Blvd corridor - Center Village Dr to Anchor Dune Dr
  plan: MPO 454568-1 (southern segment)
  stage: Design firm being hired
  published_before_rule: true
  about: A new road north from Center Village Drive through Bexley North towards Angeline, in three pieces planned separately. No study or workshop published yet.
  page: true
  card:
    title: "Sunlake Blvd Corridor"
    sub: "What has been published about plans for Sunlake Boulevard north of Bud Bexley Parkway, and where it stands."
