# Rangeland Blvd (LRTP 114.2) - facts
#
# One entry per figure. Each one must name a source listed in data/sources.yaml,
# and the build stops if a page asks for a fact id that is not in this file.
#
#   id         how pages refer to it:  {% fact "rangeland.aadt.gunn.2023" %}
#   statement  what the figure is, in words
#   value      the figure itself - a number, a grade letter, or low/high for a range
#   unit       what the number counts
#   source     id of the document it was read from (data/sources.yaml)
#   as_of      date of that document
#   status     current | disputed | superseded
#   note       optional - anything a reader checking it should know
#   replaces   optional - id of the older fact this one replaces, when a newer
#              document gives a new figure for the same thing. Mark the older
#              fact 'superseded'; the Figures and sources page then shows the
#              two together as a history.
#   change_note  optional - on a fact with 'replaces': anything a reader
#              comparing the two should know (e.g. not measured the same way)
#   ai_checked optional - date Claude (AI) last checked the value, description
#              and location against the source document itself
#   verified   optional - date Patrick last verified it against the document
#              himself. Only Patrick sets this; Claude never does.
#   decimals   optional - how many decimal places to print (default 1 for money)
#
# Level-of-service grades are the EVENING peak. The county publishes AM (PM)
# pairs; this page shows the PM grade only (see corrections 2, 3 and 13).

