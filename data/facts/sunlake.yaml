# Sunlake Blvd corridor - facts
#
# Same format as data/facts/rangeland.yaml (see its header). The corridor is three
# pieces, used as the <subject> part of each id:
#   south     Center Village Dr (north of Bud Bexley Pkwy) to south of Appenzeller
#             Blvd - the county's project, MPO 454568-1
#   angeline  south of Appenzeller Blvd / the Angeline line to south of Wilton Way
#   north     south of Wilton Way to Anchor Dune Dr
#
# Added 28 Sep 2026. Not yet spot-checked by Patrick, so no 'checked' dates yet.

# ---- The project

- id: sunlake.length-miles.south
  statement: 'Approximate length of the Sunlake Blvd design project, Center Village Dr to south of Appenzeller Blvd'
  value: 2.70
  unit: miles
  source: pasco-rsq-bw-26-019
  location: 'Section 1, "which is an approximate length of 2.70 miles"'
  as_of: '2025-12-18'
  status: current
  decimals: 2

