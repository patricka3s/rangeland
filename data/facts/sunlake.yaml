# ---- Schedule and process

- id: sunlake.schedule.south.funded-phase
  statement: 'Funded phase and year for Sunlake Blvd (454568-1) in the MPO 2026 List of Project Priorities'
  value: Route study, FY 2026
  unit: phase
  source: mpo-lopp-2026
  location: 'page 3, priority 11, "Funded Phase" and "Funded Year" columns; listed under "Construction unfunded"'
  as_of: '2026-06-11'
  status: current
  note: 'The "2026 Status" column reads: "Design funded FY 2026 in CIP, ROW funded FY 2027 in CIP, CST Funded in FY 2028-2029 CIP". The request is PD&E, design and right-of-way.'

- id: sunlake.schedule.south.design-shortlist
  statement: 'Commission approved the shortlist for the Sunlake Blvd design contract (WGI, Burgess & Niple, IC&E, in that order) and delegated negotiation to the County Administrator, not to exceed the budgeted amount plus 20%'
  value: '2026-06-02'
  unit: date
  source: pasco-bcc-2026-06-02
  location: 'consent item C18 (PU26-0018); minutes page 6, "Approved Staff''s recommendation"'
  as_of: '2026-06-02'
  status: current
  note: 'Five firms applied. Per the memo, the agreement runs 540 calendar days once signed and is reported to the Board afterwards as a Noted Item.'

