# Groups - places or facts that a document puts together: a corridor of
# consecutive projects, the pieces of one road in the capital plan, and so on.
# A group is itself a claim, so it names the document that groups them.
#
#   id, name, kind (corridor | plan-lines | ...)
#   source, location   the document that puts them together, and where
#   about              one plain sentence on what connects them, from that document
#   members            place ids from places.yaml, in order
#   totals             optional sums worked out at build time:
#                        label, facts (the ids to add), decimals
#                      The build only adds figures with the same unit from the same
#                      document - so a total never mixes things measured differently.

- id: rangeland-corridor
  kind: corridor
  name: Rangeland Blvd, Bud Bexley Pkwy and Caliente Blvd (LRTP 114.2 to 114.4)
  source: mpo-2050-lrtp
  location: Appendix B project sheets, pages 38 to 40 (projects 114.2, 114.3 and 114.4)
  about: The long-range plan numbers them as one series; each project starts where the one before it ends - Cattle Gap Trl to Bexley Village Dr, Bexley Village Dr to US 41, then US 41 to CR 583 (Ehren Cutoff).
  members: [rangeland.new, budbexley.lrtp, caliente.lrtp]
  totals:
    - label: Length, all three projects
      facts: [rangeland.length-miles, rangeland.length-miles.budbexley, rangeland.length-miles.caliente]
      decimals: 2

- id: sunlake-plan-lines
  kind: plan-lines
  name: Sunlake Blvd, the three lines in the county capital plan
  source: pasco-fy2026-budget
  location: FY 2026-2030 Capital Improvement Plan, Road Improvements table, printed page 124
  about: The adopted FY 2026 budget carries Sunlake Blvd north of Bud Bexley Pkwy as three separate lines, south to north.
  members: [sunlake.cip-south, sunlake.cip-angeline, sunlake.cip-north]
  totals:
    - label: FY 2026 (adopted), all three lines
      facts: [sunlake.funding.south.fy2026, sunlake.funding.angeline.fy2026, sunlake.funding.north.fy2026]
      decimals: 1
