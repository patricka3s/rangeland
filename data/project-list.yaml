# Project list - every project on an official list, whether or not the site
# covers it. Shown on the home page ("Other projects in Pasco") and on Explore
# by Road ("Projects on this road"). Projects the site COVERS (with their own
# page, checked and kept up to date) are marked covered: <project id>; the rest
# are LISTED ONLY: one line each, as the document gives it, with a link to it.
#
# Rules (like events.yaml):
#   - Every row is copied from its source as written - name, from, to,
#     description, agency, status - never reworded, summarised or worked out.
#     A listed row is not a fact, has no figures of its own, and isn't checked
#     or kept current the way covered projects are; the page says so.
#   - roads: the roads named in the project's own name (or, for an unnamed
#     intersection project, its location) - never inferred from a map. Each must
#     be a road in places.yaml. A trail or countywide item has none.
#   - When a newer list replaces this one, add its rows and remove these.
#
#   id        unique; lopp-2026-... for the MPO's 2026 list
#   list      funded (MPO list: programmed through construction) | priority (MPO list:
#             construction unfunded) | fdot (FDOT's current projects, not on the MPO list)
#   priority  the list's priority number (priority rows only)
#   phase     FDOT's own phase - Study | Design | Construction - from the Study,
#             Design and Construction lists on its Pasco projects page. Only for
#             projects on FDOT's list; never inferred for others.
#   covered   a project id from projects.yaml, if the site covers it
#   source, location   where it's listed (sources.yaml id; page and row)
#   link      optional - the project's own official page. For FDOT projects, the
#             fdottampabay.com page with the same project number (FPN), from
#             FDOT District 7's Pasco "All Current Projects" list (checked 9 Oct 2026).
#
# Added 9 Oct 2026 from the MPO's 2026 List of Project Priorities (adopted
# 11 June 2026), pages 26-28: every row. Its Request, Funded Phase and Funded
# Year columns are left out.

# A short name for each source, used on every row (the full title is shown once).
source_names:
  mpo-lopp-2026: MPO 2026 priority list
  fdot-d7-pasco-current: FDOT's Pasco project list

