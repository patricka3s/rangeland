# Events - what happened, and what is planned, for each project.
#
# Shown on the Timeline page (/timeline/), newest first, with planned items above
# a "today" line; the Rangeland guide's "What's happened lately" box is built from
# its project's latest events. Events are sourced records, like facts: every date
# and every figure in an event comes from its source document, and the build
# stops if a source or project doesn't exist.
#
#   id        unique short name
#   date      'YYYY-MM-DD' (or 'YYYY-MM'). Planned items use a fiscal year: 'FY2027'
#             (county fiscal year N runs 1 Oct of N-1 to 30 Sep of N)
#   when      optional - how to show the date if not exact (e.g. 'Fall 2026')
#   project   a project id from projects.yaml, or a list of them
#   about     optional - which study or piece within the project
#   type      meeting | milestone | decision | contract | change-order | document |
#             deadline | planned
#   title     one line, plain and neutral ("completion extended", never "delayed again")
#   moved     optional, for a changed completion date - {from: 'YYYY-MM-DD', to: 'YYYY-MM-DD'}
#             (leave out 'from' if the source doesn't give it). The build adds
#             "from X to Y" to the title, and the Timeline shows the old date struck through.
#   detail    optional - a sentence or two more
#   source    id from sources.yaml
#   facts     optional - fact ids this event published or changed
#
# Every project gets the same kinds of event: every Commission action, every change
# order, every workshop and deadline, and every plan document - not just notable ones.

