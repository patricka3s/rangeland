# Sources - every document a fact can cite.
#
#   id          how facts refer to it (data/facts/*.yaml -> source:)
#   title       the document's own title, or a plain description
#   publisher   who issued it
#   date        the date on the document (YYYY-MM-DD, or YYYY-MM if only the month is known)
#   url         where to read it; leave out if it was never posted online
#   note        optional - anything a reader checking it should know
#
# If a value contains " #" or ": ", wrap it in double quotes - otherwise
# everything after the # is treated as a comment and silently dropped:
#   title: "Public Workshop #3 newsletter"
#
# The build stops if a fact names a source id that is not in this file.

